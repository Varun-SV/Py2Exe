name: Build Binaries

# Triggered by the Streamlit app via the GitHub API (workflow_dispatch).
# Builds the uploaded project on both Linux and Windows, uploads artifacts,
# then deletes the temporary branch regardless of outcome.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Temporary branch containing the uploaded project"
        required: true
      main_file:
        description: "Main Python file to compile (e.g. main.py)"
        required: true
        default: "main.py"
      exe_name:
        description: "Output binary name (no extension)"
        required: false
        default: "output"
      python_version:
        description: "Python version (3.9 / 3.10 / 3.11 / 3.12)"
        required: false
        default: "3.11"
      bundle_type:
        description: "onefile or onedir"
        required: false
        default: "onefile"
      windowed:
        description: "true = hide console window (GUI apps)"
        required: false
        default: "false"
      icon_file:
        description: "Icon filename inside uploaded_project/ (empty = no icon)"
        required: false
        default: ""
      asset_files:
        description: "Comma-separated filenames in uploaded_project/_assets/ (empty = none)"
        required: false
        default: ""

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}
          cache: "pip"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install Pillow for icon conversion
        if: ${{ github.event.inputs.icon_file != '' }}
        run: pip install pillow

      - name: Install project dependencies
        shell: bash
        run: |
          if [ -f uploaded_project/requirements.txt ]; then
            pip install -r uploaded_project/requirements.txt
          fi

      - name: Build binary
        shell: bash
        run: |
          ARGS="--${{ github.event.inputs.bundle_type }}"
          ARGS="$ARGS --name ${{ github.event.inputs.exe_name }}"

          if [ "${{ github.event.inputs.windowed }}" = "true" ]; then
            ARGS="$ARGS --windowed"
          fi

          if [ -n "${{ github.event.inputs.icon_file }}" ]; then
            ARGS="$ARGS --icon uploaded_project/${{ github.event.inputs.icon_file }}"
          fi

          IFS=',' read -ra ASSETS <<< "${{ github.event.inputs.asset_files }}"
          for asset in "${ASSETS[@]}"; do
            if [ -n "$asset" ]; then
              ARGS="$ARGS --add-data uploaded_project/_assets/${asset}:."
            fi
          done

          python -m PyInstaller $ARGS uploaded_project/${{ github.event.inputs.main_file }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/
          retention-days: 1

  cleanup:
    name: Delete temporary branch
    needs: build
    runs-on: ubuntu-latest
    # Always run cleanup, even if the build jobs failed
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Delete temp branch
        run: git push origin --delete "${{ github.event.inputs.branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
